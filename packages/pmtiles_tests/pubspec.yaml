name: pmtiles_tests
description: Integration tests for pmtiles
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.11.3
  flutter: ">=3.19.0"

resolution: workspace

# We don't actually need flutter, but this is a useful way to ensure
# we don't conflict with any pinned dependencies.
# https://github.com/dart-lang/sdk/wiki/Flutter-Pinned-Packages
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.15.0
  convert: ^3.1.2
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0
  path: ^1.9.1
  pmtiles: ^2.0.0
  stream_channel: ^2.1.4
  test: ^1.31.0
